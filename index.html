    <script>
      (function() {
        // Intercept Vite HMR WebSocket in AI Studio cloud preview environment
        const RealWS = window.WebSocket;
        if (!RealWS) return;
        function MockViteWS(url, protocols) {
          const isViteHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                            (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                            (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));
          if (isViteHmr) {
            const listeners = {};
            const mock = {
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              readyState: 1,
              bufferedAmount: 0,
              extensions: '',
              protocol: 'vite-hmr',
              url: url,
              binaryType: 'blob',
              send: function() {},
              close: function() { mock.readyState = 3; },
              addEventListener: function(event, handler) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(handler);
              },
              removeEventListener: function(event, handler) {
                if (listeners[event]) {
                  listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                }
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
            setTimeout(function() {
              if (typeof mock.onopen === 'function') mock.onopen({ type: 'open' });
              if (listeners['open']) {
                listeners['open'].forEach(function(fn) { fn({ type: 'open' }); });
              }
            }, 30);
            return mock;
          }
          return new RealWS(url, protocols);
        }
        MockViteWS.prototype = RealWS.prototype;
        MockViteWS.CONNECTING = RealWS.CONNECTING;
        MockViteWS.OPEN = RealWS.OPEN;
        MockViteWS.CLOSING = RealWS.CLOSING;
        MockViteWS.CLOSED = RealWS.CLOSED;
        window.WebSocket = MockViteWS;

        // Suppress any stray WebSocket errors from console
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('ws'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
