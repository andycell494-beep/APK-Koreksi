<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Sheet of Paper -->
  <g filter="url(#shadow)">
    <rect x="110" y="90" width="230" height="320" rx="20" fill="#ffffff" />
    <rect x="145" y="140" width="160" height="14" rx="7" fill="#e2e8f0" />
    <rect x="145" y="175" width="130" height="14" rx="7" fill="#e2e8f0" />
    <rect x="145" y="210" width="150" height="14" rx="7" fill="#e2e8f0" />
    <rect x="145" y="245" width="110" height="14" rx="7" fill="#e2e8f0" />
    
    <!-- Answer check marks -->
    <path d="M 145 295 L 160 310 L 195 275" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="210" y="290" width="85" height="14" rx="7" fill="#cbd5e1" />
    
    <path d="M 145 350 L 160 365 L 195 330" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="210" y="345" width="70" height="14" rx="7" fill="#cbd5e1" />
  </g>

  <!-- Grade Badge / AI Star -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="330" r="75" fill="url(#gold)" />
    <!-- 100/A+ Score Mark -->
    <text x="360" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">A+</text>
  </g>

  <!-- AI Sparkle / Magic Wand -->
  <path d="M 370 120 L 378 140 L 398 148 L 378 156 L 370 176 L 362 156 L 342 148 L 362 140 Z" fill="#fde047" />
  <path d="M 330 90 L 334 102 L 346 106 L 334 110 L 330 122 L 326 110 L 314 106 L 326 102 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 420 180 L 423 189 L 432 192 L 423 195 L 420 204 L 417 195 L 408 192 L 417 189 Z" fill="#ffffff" opacity="0.8" />
</svg>
